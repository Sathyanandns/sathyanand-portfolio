<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Sathyanand N S</title>
    <link rel="icon" type="image/svg+xml" href="/sathyanand-portfolio/favicon.svg" />
    <style>
      :root {
        --bg: #0f172a;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #3b82f6;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .code {
        font-size: clamp(5rem, 15vw, 8rem);
        font-weight: 900;
        line-height: 1;
        background: linear-gradient(135deg, #60a5fa, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 1.8rem;
        margin-bottom: 12px;
      }
      p {
        color: var(--muted);
        max-width: 480px;
        margin-bottom: 32px;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 28px;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        transition: transform 0.2s ease;
      }
      a:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for doesn't exist or has moved. Return to Sathyanand's portfolio to explore projects, skills, and background.</p>
    <a href="/sathyanand-portfolio/">Return to Portfolio &rarr;</a>
  </body>
</html>
